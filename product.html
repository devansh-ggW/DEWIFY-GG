const params=new URLSearchParams(location.search),raw=Number(params.get('id')),id=Number.isInteger(raw)&&raw>=0&&raw<products.length?raw:0,p=products[id],app=document.getElementById('app');app.innerHTML=`<article class="product"><div class="media"><img src="${p.image}" alt="${p.title}" decoding="async"></div><div class="info"><div class="kicker">DEWIFY / AMAZON PICK</div><h1>${p.title}</h1><p class="desc">${p.info}</p><div class="specs">${p.specs.map(s=>`<div class="spec"><b>${s}</b><span>PRODUCT SPEC</span></div>`).join('')}</div><div class="price">${p.price}</div><div class="actions"><div class="share-wrap"><button class="action" id="shareBtn" type="button" aria-haspopup="true" aria-expanded="false"><svg class="share-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="18" cy="5" r="2.2"/><circle cx="6" cy="12" r="2.2"/><circle cx="18" cy="19" r="2.2"/><path d="m8 11 7.8-4.5M8 13l7.8 4.5"/></svg><span>SHARE</span></button><div class="share-menu" id="shareMenu" role="menu"><button class="share-option" data-share="copy">📋 Copy Link</button><button class="share-option" data-share="native">↗ More</button><button class="share-option" data-share="whatsapp">WhatsApp</button><button class="share-option" data-share="telegram">Telegram</button><button class="share-option" data-share="email">Email</button><button class="share-option" data-share="sms">SMS</button><button class="share-option" data-share="x">𝕏 Post</button><button class="share-option" data-share="facebook">Facebook</button><button class="share-option" data-share="reddit">Reddit</button><button class="share-option full" data-share="linkedin">LinkedIn</button></div></div><a class="action buy" href="${p.amazon}" target="_blank" rel="sponsored noopener noreferrer">BUY ON AMAZON →</a></div><p class="note">Price and availability can change on Amazon. Check the Amazon product page for the latest offer. As an Amazon Associate I earn from qualifying purchases.</p></div></article>`;document.title='DEWIFY — '+p.title;
const toast=document.getElementById('toast'),shareBtn=document.getElementById('shareBtn'),shareMenu=document.getElementById('shareMenu');function showToast(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200)}function closeMenu(){shareMenu.classList.remove('open');shareBtn.setAttribute('aria-expanded','false')}
shareBtn.addEventListener('click',()=>{const open=shareMenu.classList.toggle('open');shareBtn.setAttribute('aria-expanded',String(open))});document.addEventListener('click',e=>{if(!e.target.closest('.share-wrap'))closeMenu()});
const shareText='Check out '+p.title+' on DEWIFY — '+p.price;const url=location.href;async function doShare(type){const encodedUrl=encodeURIComponent(url),encodedText=encodeURIComponent(shareText);if(type==='copy'){try{await navigator.clipboard.writeText(url);showToast('Product link copied!')}catch{showToast('Copy unavailable — use the address bar.')}closeMenu();return}if(type==='native'){if(navigator.share){try{await navigator.share({title:p.title,text:shareText,url});}catch(e){}closeMenu();return}showToast('Native sharing is not supported here.');closeMenu();return}let target='';if(type==='whatsapp')target='https://wa.me/?text='+encodedText+'%20'+encodedUrl;else if(type==='telegram')target='https://t.me/share/url?url='+encodedUrl+'&text='+encodedText;else if(type==='email')target='mailto:?subject='+encodeURIComponent('Check out '+p.title)+'&body='+encodedText+'%0A'+encodedUrl;else if(type==='sms')target='sms:?body='+encodedText+'%20'+encodedUrl;else if(type==='x')target='https://twitter.com/intent/tweet?text='+encodedText+'&url='+encodedUrl;else if(type==='facebook')target='https://www.facebook.com/sharer/sharer.php?u='+encodedUrl;else if(type==='reddit')target='https://www.reddit.com/submit?url='+encodedUrl+'&title='+encodeURIComponent(p.title);else if(type==='linkedin')target='https://www.linkedin.com/sharing/share-offsite/?url='+encodedUrl;if(target)window.open(target,'_blank','noopener,noreferrer');closeMenu()}
shareMenu.addEventListener('click',e=>{const btn=e.target.closest('[data-share]');if(btn)doShare(btn.dataset.share)});
</script></body></html>
