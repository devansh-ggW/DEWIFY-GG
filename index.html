<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808">
<meta name="description" content="DEWIFY — discover popular products available on Amazon.">
<meta name="application-name" content="DEWIFY">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta property="og:type" content="website">
<meta property="og:title" content="DEWIFY">
<meta property="og:description" content="Discover popular products available on Amazon.">
<meta property="og:url" content="https://dewify.shop/">
<meta property="og:site_name" content="DEWIFY">
<meta property="og:image" content="https://dewify.shop/apple-touch-icon.png">
<title>DEWIFY</title>
<style>
:root{--bg:#080808;--text:#f3f1eb;--muted:#8d8b86;--line:rgba(243,241,235,.14)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100vh;display:grid;place-items:center}
#starfield{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:1;text-align:center;padding:32px;max-width:760px}
.brand{font-size:clamp(48px,10vw,110px);font-weight:800;letter-spacing:-.08em;line-height:.9}
.tagline{margin:26px auto 0;color:var(--muted);font-size:14px;line-height:1.6;max-width:520px}
.button{display:inline-flex;align-items:center;justify-content:center;margin-top:28px;padding:14px 24px;border:1px solid var(--line);border-radius:999px;color:var(--bg);background:var(--text);font-size:13px;font-weight:700;text-decoration:none;transition:transform .2s ease,opacity .2s ease}
.button:hover{transform:translateY(-2px);opacity:.9}
.links{margin-top:18px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.links a{color:var(--muted);font-size:11px;text-decoration:none}
.links a:hover{color:var(--text)}
</style>
</head>
<body>
<canvas id="starfield" aria-hidden="true"></canvas>
<main>
<div class="brand">DEWIFY</div>
<div class="tagline">Discover popular products available on Amazon.</div>
<a class="button" href="catalog.html">Browse Catalog</a>
<div class="links">
<a href="privacy.html">Privacy Policy</a>
<a href="terms.html">Terms &amp; Conditions</a>
</div>
</main>
<script defer src="stars.js?v=6"></script>
</body>
</html>
